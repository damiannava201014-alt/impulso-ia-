
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generador de textos con inteligencia artificial de Impulso IA.">
  <title>Generador de textos | Impulso IA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #0b1220;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    main { max-width: 760px; margin: 35px auto; }
    .volver { color: #b7a8ff; text-decoration: none; }
    h1 { margin-top: 28px; font-size: 32px; }
    p { color: #cbd5e1; line-height: 1.6; }
    label { display: block; margin: 20px 0 8px; font-weight: bold; }
    select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #111c30;
      color: white;
      font: inherit;
    }
    textarea { min-height: 125px; resize: vertical; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: #6c4cff;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin: 12px 8px 0 0;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .resultado {
      margin-top: 24px;
      padding: 18px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #111c30;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <main>
    <a class="volver" href="index.html">← Volver a Impulso IA</a>
    <h1>✍️ Generador de textos</h1>
    <p>Describe lo que necesitas y deja que Impulso IA te ayude a preparar un borrador.</p>

    <label for="tipo">¿Qué quieres crear?</label>
    <select id="tipo">
      <option>Ensayo o tarea</option>
      <option>Publicación para redes sociales</option>
      <option>Historia creativa</option>
      <option>Correo electrónico</option>
      <option>Descripción de producto</option>
      <option>Ideas para un proyecto</option>
    </select>

    <label for="idea">Describe tu idea</label>
    <textarea id="idea" maxlength="4000" placeholder="Ejemplo: escribe una publicación sobre los beneficios de aprender inteligencia artificial."></textarea>

    <button id="crear">✨ Generar texto</button>
    <button id="copiar" type="button">📋 Copiar resultado</button>

    <div id="resultado" class="resultado" aria-live="polite">Tu texto aparecerá aquí.</div>
  </main>

  <script>
    const API = "https://impulso-ia-api.damiannava201014.workers.dev";
    const tipo = document.getElementById("tipo");
    const idea = document.getElementById("idea");
    const crear = document.getElementById("crear");
    const copiar = document.getElementById("copiar");
    const resultado = document.getElementById("resultado");

    crear.addEventListener("click", async () => {
      const solicitud = idea.value.trim();

      if (!solicitud) {
        resultado.textContent = "Primero escribe qué texto necesitas.";
        idea.focus();
        return;
      }

      crear.disabled = true;
      resultado.textContent = "Impulso IA está preparando tu texto…";

      try {
        const respuesta = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mensaje: "Ayúdame a crear un borrador de tipo: " +
              tipo.value + ". Mi solicitud es: " + solicitud +
              ". Responde en español claro y con un formato útil."
          })
        });

        if (!respuesta.ok) {
          throw new Error("El servidor respondió con el código " + respuesta.status);
        }

        const data = await respuesta.json();
        const texto = data.respuesta ??
          data.choices?.[0]?.message?.content ??
          data.response ?? data.reply ?? data.text ??
          data.mensaje ?? data.result;

        if (typeof texto !== "string" || !texto.trim()) {
          throw new Error("No se encontró texto en la respuesta del servidor.");
        }

        resultado.textContent = texto;
      } catch (error) {
        resultado.textContent =
          "No pude generar el texto. " + error.message +
          "\nComprueba tu conexión e inténtalo de nuevo.";
      } finally {
        crear.disabled = false;
      }
    });

    copiar.addEventListener("click", async () => {
      const texto = resultado.textContent;
      if (!texto || texto === "Tu texto aparecerá aquí.") return;

      try {
        await navigator.clipboard.writeText(texto);
        copiar.textContent = "✅ Copiado";
        setTimeout(() => copiar.textContent = "📋 Copiar resultado", 1800);
      } catch {
        resultado.textContent += "\n\nNo se pudo copiar automáticamente. Selecciona el texto y cópialo manualmente.";
      }
    });
  </script>
</body>
</html>
